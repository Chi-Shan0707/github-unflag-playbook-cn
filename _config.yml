title: GitHub Unflag Playbook CN
description: A concise Markdown knowledge base for flag recovery, symptoms, causes, and case records.
url: https://chi-shan0707.github.io
baseurl: /github-unflag-playbook-cn
theme: minima
permalink: pretty

# GitHub Pages runs Jekyll 3.9, whose `exclude` does not merge with the
# built-in list — it replaces it. The defaults are restated here so nothing
# is silently un-excluded. These four files are repo documentation, not site
# pages: they have no front matter, but a dot in the basename still makes
# Jekyll treat the `.en` pair as Pages, which would publish them under the
# site layout, land them in sitemap.xml, and emit an hreflang pointing at
# pages that do not exist.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - README.en.md
  - CONTRIBUTING.md
  - CONTRIBUTING.en.md

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
      lang: "zh"
      description: "面向中国大陆开发者的 GitHub 账号隐藏、限制与恢复自救手册与案例档案。"
  - scope:
      path: "en"
    values:
      lang: "en"
      description: "A playbook and case archive for GitHub users affected by hidden, restricted, or suspended account status."
  - scope:
      path: "cases"
    values:
      switch_url: "/en/cases/"
