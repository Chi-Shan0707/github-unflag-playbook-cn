title: GitHub Unflag Playbook CN
description: A concise Markdown knowledge base for flag recovery, symptoms, causes, and case records.
url: https://chi-shan0707.github.io
baseurl: /github-unflag-playbook-cn
theme: minima
permalink: pretty

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
      lang: "zh"
      description: "面向中国大陆开发者的 GitHub 账号隐藏、限制与恢复自救手册与案例档案。"
  - scope:
      path: "en"
    values:
      lang: "en"
      description: "A playbook and case archive for GitHub users affected by hidden, restricted, or suspended account status."
  - scope:
      path: "cases"
    values:
      switch_url: "/en/cases/"
